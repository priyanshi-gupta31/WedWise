<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F0DF" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#94781B" />
    </linearGradient>
    <linearGradient id="blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E9E6" />
      <stop offset="100%" stop-color="#E8A598" />
    </linearGradient>
  </defs>
  
  <!-- Soft background circle -->
  <circle cx="50" cy="50" r="48" fill="#FAF8F5" stroke="#EDE0BF" stroke-width="2" />
  
  <!-- Outer Interlocking Ring (Groom/Wedding) -->
  <circle cx="42" cy="54" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
  
  <!-- Inner Interlocking Ring (Bride) -->
  <circle cx="58" cy="50" r="20" fill="none" stroke="url(#blushGrad)" stroke-width="4.5" />
  
  <!-- Sparkle / Diamond atop the ring -->
  <path d="M 42 22 L 46 30 L 54 30 L 48 35 L 50 43 L 42 38 L 34 43 L 36 35 L 30 30 L 38 30 Z" fill="url(#goldGrad)" />
  <circle cx="42" cy="32" r="3" fill="#FFFFFF" />
</svg>